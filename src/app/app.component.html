<ion-app>
  <ion-menu contentId="main-content" type="overlay" *ngIf="authService.isLoggedIn()" [swipeGesture]="true">
    <ion-header class="ion-no-border">
      <ion-toolbar color="primary">
        <ion-title>gStock Pro</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <ion-list id="inbox-list">
        <ion-list-header>Menu Principal</ion-list-header>
        <ion-note>Gestion de Stock & Facturation</ion-note>

        <ion-menu-toggle auto-hide="false" *ngFor="let p of appPages; let i = index">
          <ion-item routerDirection="forward" [routerLink]="[p.url]" lines="none" detail="false" routerLinkActive="selected">
            <ion-icon slot="start" [ios]="p.icon + '-outline'" [md]="p.icon + '-sharp'"></ion-icon>
            <ion-label>{{ p.title }}</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>

      <ion-list id="labels-list">
        <ion-list-header>Préférences</ion-list-header>
        <ion-item lines="none">
          <ion-icon slot="start" name="moon-outline"></ion-icon>
          <ion-label>Mode Sombre</ion-label>
          <ion-toggle [checked]="isDarkMode" (ionChange)="toggleDarkMode()"></ion-toggle>
        </ion-item>
        <ion-item (click)="onLogout()" lines="none" detail="false" class="clickable">
          <ion-icon slot="start" name="log-out-outline" color="danger"></ion-icon>
          <ion-label color="danger">Déconnexion</ion-label>
        </ion-item>
      </ion-list>
    </ion-content>
  </ion-menu>
  
  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
